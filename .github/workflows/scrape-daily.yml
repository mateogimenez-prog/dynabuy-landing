name: Scrape Dynabuy Meetings

on:
  schedule:
    - cron: '0 4 * * *'  # 05h00 Paris (UTC+1) / 04h00 UTC
  workflow_dispatch:      # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Backup current meetings.json
        run: cp data/meetings.json data/meetings.json.bak || true

      - name: Run scraper
        id: scrape
        run: node scripts/scrape-meetings.mjs
        continue-on-error: true

      - name: Restore backup if scraper failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Le scraping a échoué. Restauration du dernier meetings.json valide."
          cp data/meetings.json.bak data/meetings.json || true
          echo "Vérifiez les logs ci-dessus pour diagnostiquer l'erreur."
          exit 1

      - name: Clean up backup
        if: steps.scrape.outcome == 'success'
        run: rm -f data/meetings.json.bak

      - name: Commit updated meetings.json
        if: steps.scrape.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mise à jour automatique des réunions [skip ci]"
          file_pattern: data/meetings.json
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
